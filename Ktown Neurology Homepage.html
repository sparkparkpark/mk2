<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김민희 신경과 · Minhee Kim Neurology</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   Ktown Neurology — v2 Modern Clinical
   Clean, young, hospital-grade aesthetic
   ============================================================ */

:root {
  --bg: #FFFFFF;
  --bg-alt: #F4F6FA;        /* subtle blue-gray panel */
  --bg-soft: #F8FAFC;
  --paper: #FFFFFF;
  --ink: #0B1220;           /* near-black with cool cast */
  --ink-soft: #2A3447;
  --ink-mute: #6B7589;
  --ink-faint: #98A1B3;
  --rule: #E5E9F0;
  --rule-soft: #EEF1F6;
  --accent: #1B5FBF;        /* clinical blue */
  --accent-soft: #E8F0FB;
  --accent-deep: #134895;
  --success: #0E9F6E;

  --sans: "Pretendard", "Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Helvetica Neue", Arial, sans-serif;
  --display: "Inter", "Pretendard", -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(11, 18, 32, 0.04), 0 1px 1px rgba(11, 18, 32, 0.02);
  --shadow: 0 4px 16px rgba(11, 18, 32, 0.06), 0 1px 2px rgba(11, 18, 32, 0.04);
  --shadow-lg: 0 12px 32px rgba(11, 18, 32, 0.08), 0 2px 4px rgba(11, 18, 32, 0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "kern", "ss01";
  word-break: keep-all;
  overflow-wrap: break-word;
}

:lang(ko), html[lang="ko"] body { word-break: keep-all; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 40px;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s, background 0.2s;
}
.site-header.scrolled { border-bottom-color: var(--rule); }
.header-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 14px 40px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 40px;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(27, 95, 191, 0.25);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-ko {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.brand-en {
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--ink-mute);
  margin-top: 2px;
  font-weight: 500;
}

.site-nav {
  display: flex;
  gap: 4px;
  justify-content: center;
}
.site-nav a {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-soft);
  padding: 8px 14px;
  border-radius: 8px;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.site-nav a:hover { background: var(--bg-alt); color: var(--ink); }

.header-end {
  display: flex;
  align-items: center;
  gap: 14px;
}
.lang-toggle {
  display: flex;
  align-items: center;
  background: var(--bg-alt);
  border-radius: 999px;
  padding: 3px;
  font-size: 12px;
  font-weight: 600;
}
.lang-toggle button {
  color: var(--ink-mute);
  padding: 6px 12px;
  border-radius: 999px;
  transition: all 0.15s;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.lang-toggle button.on {
  background: #fff;
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.lang-divider { display: none; }

.btn-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 999px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  box-shadow: 0 2px 8px rgba(27, 95, 191, 0.25);
  white-space: nowrap;
}
.btn-cta:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(27, 95, 191, 0.32);
}
.btn-cta-arrow { transition: transform 0.2s; font-size: 14px; }
.btn-cta:hover .btn-cta-arrow { transform: translateX(2px); }

/* ============================================================
   HERO
   ============================================================ */
.hero {
  padding: 80px 0 100px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.hero-grid {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 40px;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 72px;
  align-items: center;
  position: relative;
  z-index: 1;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 10px;
  background: var(--accent-soft);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-deep);
  letter-spacing: -0.005em;
  margin-bottom: 28px;
  white-space: nowrap;
}
.eb-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.eb-dot::after {
  content: ""; position: absolute; inset: -4px;
  border-radius: 50%; background: inherit; opacity: 0.4;
  animation: pulse 2.2s ease-in-out infinite;
}
.eb-dot { position: relative; }
@keyframes pulse {
  0%, 100% { transform: scale(0.6); opacity: 0.5; }
  50% { transform: scale(1.4); opacity: 0; }
}

.hero-title {
  font-family: var(--display);
  font-size: clamp(40px, 5.4vw, 76px);
  line-height: 1.05;
  letter-spacing: -0.035em;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 28px;
  text-wrap: balance;
}
.hero-title.lang-en { letter-spacing: -0.04em; }
.hl-line { display: block; }
.hl-line.indent { padding-left: 0; }
.hl-period { color: var(--accent); }

.hero-lede {
  font-size: 18px;
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 500px;
  margin-bottom: 36px;
  font-weight: 400;
}

.hero-actions {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.005em;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 14px rgba(27, 95, 191, 0.28);
  white-space: nowrap;
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(27, 95, 191, 0.36);
}
.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 22px;
  border-radius: 12px;
  background: var(--bg-alt);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-secondary:hover { background: var(--rule); }

.hero-meta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--ink-mute);
  font-weight: 500;
  white-space: nowrap;
}
.hero-meta-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  position: relative;
  background: var(--success) !important;
}
.hero-meta-pulse::after {
  content: ""; position: absolute; inset: -2px;
  border-radius: 50%; background: var(--success);
  opacity: 0.3; animation: ring 2s ease-in-out infinite;
}
@keyframes ring {
  0% { transform: scale(0.8); opacity: 0.4; }
  100% { transform: scale(2); opacity: 0; }
}

/* Hero figure */
.hero-right { position: relative; }
.hero-figure { margin: 0; position: relative; }
.figure-frame {
  position: relative;
  aspect-ratio: 4 / 5;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  background: var(--bg-soft);
}
.figure-corner { display: none; }

.figure-cap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
  font-size: 13px;
  color: var(--ink-mute);
  font-weight: 500;
}
.figure-cap span:last-child { white-space: nowrap; }
.cap-rule {
  width: 24px; height: 1px; background: var(--ink-faint); flex-shrink: 0;
}

/* Floating credential card */
.hero-figure::after {
  content: "";
  position: absolute;
  bottom: 80px; right: -24px;
  width: 200px; height: 90px;
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  pointer-events: none;
}
.hero-badge {
  position: absolute;
  bottom: 80px; right: -24px;
  width: 200px;
  padding: 16px;
  background: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
}
.hero-figure::after { display: none; }

.hero-badge-icon {
  width: 38px; height: 38px;
  background: var(--accent-soft);
  color: var(--accent-deep);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.hero-badge-text { line-height: 1.3; }
.hero-badge-text small {
  font-size: 11px;
  color: var(--ink-mute);
  font-weight: 500;
  display: block;
}
.hero-badge-text b {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.01em;
}

/* Placeholder visual */
.ph {
  position: relative;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #EEF2F8 0%, #DCE4EF 100%);
  color: var(--ink);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ph-portrait { aspect-ratio: 4 / 5; }
.ph-square   { aspect-ratio: 1 / 1; }
.ph-landscape { aspect-ratio: 16 / 10; }
.ph-stripes { display: none; }
.ph-label {
  position: relative;
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--ink-mute);
  text-transform: uppercase;
  display: flex;
  gap: 6px;
  background: rgba(255, 255, 255, 0.85);
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 600;
  backdrop-filter: blur(8px);
  white-space: nowrap;
}
.ph-bracket { color: var(--accent); }

/* ============================================================
   MARQUEE — credential strip
   ============================================================ */
.marquee {
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 14px 0;
  overflow: hidden;
  background: var(--bg-soft);
}
.marquee-track {
  display: inline-flex;
  gap: 56px;
  white-space: nowrap;
  animation: marquee 60s linear infinite;
  padding-left: 56px;
}
.marquee-item {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--ink-soft);
  font-weight: 500;
}
.marquee-dot {
  width: 4px; height: 4px; border-radius: 50%;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-33.333%); }
}

/* ============================================================
   SECTION LABEL
   ============================================================ */
.section-label {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 40px;
}
.section-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent-deep) !important;
  font-size: 12px;
  font-weight: 700;
  font-style: normal !important;
  font-family: var(--mono);
}
.section-rule { display: none; }
.section-kicker {
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 600;
  white-space: nowrap;
}

.section-title {
  font-family: var(--display);
  font-size: clamp(32px, 4vw, 52px);
  line-height: 1.1;
  letter-spacing: -0.03em;
  font-weight: 700;
  color: var(--ink);
  text-wrap: balance;
  font-style: normal !important;
}
.section-title.lang-en { font-style: normal; }
.title-line { display: block; }

/* ============================================================
   ABOUT
   ============================================================ */
.about {
  padding: 100px 0 120px;
  border-top: 1px solid var(--rule);
}
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 72px;
  align-items: start;
}
.about-left .section-title { margin-bottom: 28px; }
.about-left .ph {
  margin-bottom: 28px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}

.pull-quote {
  font-family: var(--display);
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink);
  font-style: normal;
  font-weight: 500;
  letter-spacing: -0.015em;
  padding: 20px 24px;
  background: var(--bg-soft);
  border-radius: var(--radius);
  border-left: 3px solid var(--accent);
}

.about-right { padding-top: 8px; }
.about-body p {
  font-size: 16px;
  line-height: 1.75;
  color: var(--ink-soft);
  margin-bottom: 18px;
}
.about-body p:first-letter { font-size: 1em; font-weight: 400; color: inherit; }

.cred-list {
  margin-top: 44px;
  padding: 24px;
  border-top: none;
  background: var(--bg-soft);
  border-radius: var(--radius);
}
.cred-head {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 700;
  margin-bottom: 16px;
}
.cred-rule { flex: 1; height: 1px; background: var(--rule); }
.cred-row {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 20px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 14px;
  align-items: center;
}
.cred-row:last-child { border-bottom: none; }
.cred-year {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--accent) !important;
  font-weight: 600;
}
.cred-text { color: var(--ink-soft); font-weight: 500; }

/* ============================================================
   SERVICES
   ============================================================ */
.services {
  padding: 100px 0 120px;
  background: var(--bg-soft);
  border-top: 1px solid var(--rule);
}
.services-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: end;
  margin-bottom: 48px;
}
.services-lede {
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-soft);
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  border: none !important;
}
.service-card {
  padding: 28px;
  border: 1px solid var(--rule) !important;
  border-radius: var(--radius);
  background: #fff !important;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  outline: none;
  position: relative;
  cursor: pointer;
}
.service-card:hover,
.service-card.active,
.service-card:focus {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
  border-color: var(--accent) !important;
}
.service-tag-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.service-tag {
  width: 36px; height: 36px;
  border-radius: 10px;
  border: none !important;
  background: var(--accent-soft);
  color: var(--accent-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 14px;
  font-style: normal !important;
  font-weight: 700;
  transition: all 0.2s;
}
.service-card:hover .service-tag,
.service-card.active .service-tag {
  background: var(--accent) !important;
  color: #fff !important;
}
.service-en {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 600;
}
.service-name {
  font-family: var(--display);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
  margin-top: 4px;
  color: var(--ink);
  font-style: normal !important;
}
.service-desc {
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-soft);
}
.service-arrow {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 12px;
  font-size: 13px;
  font-weight: 600;
}
.service-rule { flex: 1; height: 1px; background: var(--rule); opacity: 1; }

/* ============================================================
   VISIT
   ============================================================ */
.visit {
  padding: 100px 0 120px;
  border-top: 1px solid var(--rule);
}
.visit-head { margin-bottom: 48px; }

.visit-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  border: none !important;
}
.visit-map-card {
  grid-column: span 2;
  grid-row: span 2;
  padding: 0 !important;
  border: 1px solid var(--rule) !important;
  border-radius: var(--radius);
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.map-frame {
  position: relative;
  flex: 1;
  min-height: 300px;
  background: var(--bg-alt);
  overflow: hidden;
  color: var(--ink);
}
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-pin {
  position: absolute;
  top: 49%; left: 58%;
  width: 18px; height: 18px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 5px rgba(27, 95, 191, 0.18), 0 4px 12px rgba(27, 95, 191, 0.3);
}
.map-pin-inner { width: 6px; height: 6px; background: #fff; border-radius: 50%; }
.map-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 20px 24px;
  border-top: 1px solid var(--rule);
}
.map-address {
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  font-weight: 600;
}
.map-link {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  background: var(--accent-soft);
  border-radius: 999px;
  border-bottom: none !important;
  letter-spacing: 0;
  text-transform: none;
}

.visit-card {
  padding: 24px;
  border: 1px solid var(--rule) !important;
  border-radius: var(--radius);
  background: #fff !important;
  box-shadow: var(--shadow-sm);
}
.visit-card-wide { grid-column: span 4; }

.visit-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.card-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent-deep) !important;
  font-family: var(--mono);
  font-size: 11px;
  font-style: normal !important;
  font-weight: 700;
}
.visit-card-head h3 {
  font-size: 13px;
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--ink) !important;
  font-weight: 700;
}

.hours-list { display: flex; flex-direction: column; gap: 0; }
.hours-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-soft) !important;
  font-size: 14px;
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel" data-presets="react">
// v2 App — modern clinical theme
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lang": "ko",
  "accent": "#1B5FBF",
  "theme": "white"
}/*EDITMODE-END*/;

const THEMES_V2 = {
  white: { bg: "#FFFFFF", bgAlt: "#F4F6FA", bgSoft: "#F8FAFC", paper: "#FFFFFF", ink: "#0B1220", inkSoft: "#2A3447", inkMute: "#6B7589" },
  cool:  { bg: "#F8FAFC", bgAlt: "#EEF2F8", bgSoft: "#F1F4F9", paper: "#FFFFFF", ink: "#0B1220", inkSoft: "#2A3447", inkMute: "#6B7589" },
  warm:  { bg: "#FAFAF7", bgAlt: "#F2F1EC", bgSoft: "#F6F5F0", paper: "#FFFFFF", ink: "#1A1916", inkSoft: "#3A372E", inkMute: "#6B6859" },
  dark:  { bg: "#0B1220", bgAlt: "#141C2E", bgSoft: "#0F1626", paper: "#141C2E", ink: "#F4F6FA", inkSoft: "#C8CFDA", inkMute: "#8A93A6" },
};

const ACCENT_PRESETS_V2 = [
  { value: "#1B5FBF", label: "Clinical blue" },
  { value: "#0E76C2", label: "Sky blue" },
  { value: "#0E9F6E", label: "Medical green" },
  { value: "#5B5FE3", label: "Indigo" },
  { value: "#0F766E", label: "Teal" },
  { value: "#1F2A44", label: "Navy" },
];

function applyThemeV2(theme, accent) {
  const t = THEMES_V2[theme] || THEMES_V2.white;
  const root = document.documentElement;
  root.style.setProperty("--bg", t.bg);
  root.style.setProperty("--bg-alt", t.bgAlt);
  root.style.setProperty("--bg-soft", t.bgSoft);
  root.style.setProperty("--paper", t.paper);
  root.style.setProperty("--ink", t.ink);
  root.style.setProperty("--ink-soft", t.inkSoft);
  root.style.setProperty("--ink-mute", t.inkMute);

  // derive an --accent-soft from accent
  const hex = accent.replace("#", "");
  const r = parseInt(hex.slice(0, 2), 16);
  const g = parseInt(hex.slice(2, 4), 16);
  const b = parseInt(hex.slice(4, 6), 16);
  // mix with bg at ~12%
  root.style.setProperty("--accent-soft", `rgba(${r},${g},${b},0.10)`);
  root.style.setProperty("--accent-deep", accent);
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const lang = tweaks.lang;
  const accent = tweaks.accent;
  const t = window.COPY[lang];

  React.useEffect(() => {
    document.documentElement.style.setProperty("--accent", accent);
    applyThemeV2(tweaks.theme, accent);
  }, [accent, tweaks.theme]);

  React.useEffect(() => {
    document.documentElement.lang = lang;
  }, [lang]);

  const setLang = (l) => setTweak("lang", l);

  return (
    <>
      <Header lang={lang} setLang={setLang} t={t} accent={accent} />
      <main>
        <Hero t={t} accent={accent} lang={lang} />
        <Marquee items={t.marquee} accent={accent} />
        <About t={t} accent={accent} lang={lang} />
        <Services t={t} accent={accent} lang={lang} />
        <Visit t={t} accent={accent} lang={lang} />
        <Resources t={t} accent={accent} lang={lang} />
      </main>
      <Footer t={t} accent={accent} lang={lang} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Language" />
        <TweakRadio
          label="Display"
          value={lang}
          options={[{ value: "ko", label: "한국어" }, { value: "en", label: "English" }]}
          onChange={(v) => setTweak("lang", v)}
        />

        <TweakSection label="Theme" />
        <TweakSelect
          label="Background"
          value={tweaks.theme}
          options={[
            { value: "white", label: "Clean white (default)" },
            { value: "cool",  label: "Cool blue-gray" },
            { value: "warm",  label: "Warm neutral" },
            { value: "dark",  label: "Dark mode" },
          ]}
          onChange={(v) => setTweak("theme", v)}
        />
        <TweakSelect
          label="Accent"
          value={accent}
          options={ACCENT_PRESETS_V2}
          onChange={(v) => setTweak("accent", v)}
        />
        <TweakColor label="Custom" value={accent} onChange={(v) => setTweak("accent", v)} />
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
